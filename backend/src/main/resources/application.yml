server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:wms}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.wms.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: wms-secret-key-2024-very-long-secret-key-for-jwt-token-generation
  expiration: 86400000

# 安全配置
security:
  # 超级管理员角色编码，多个用逗号分隔
  super-admin-roles: SUPER_ADMIN
  # 新用户注册时默认分配的角色ID
  default-role-id: 3
  # 新建用户/重置密码时的默认密码
  default-password: "123456"

# 备份配置
backup:
  path: ./backups
  keep-days: 30

logging:
  level:
    com.wms: debug
